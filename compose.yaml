name: journeysignal
services:
  postgres:
    image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: journeysignal
      POSTGRES_USER: journeysignal_owner
      POSTGRES_PASSWORD: disposable_owner_only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journeysignal_owner -d journeysignal"]
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 1048576
    volumes: ["kafka_data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    profiles: [app]
    image: journeysignal:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      JS_DATABASE_URL: postgresql+psycopg://journeysignal_owner:disposable_owner_only@postgres:5432/journeysignal
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  topic-init:
    profiles: [app]
    image: journeysignal:local
    pull_policy: never
    command: ["journeysignal", "init-topics", "--bootstrap-servers", "kafka:29092"]
    depends_on:
      kafka: {condition: service_healthy}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  api:
    profiles: [app]
    build: .
    image: journeysignal:local
    ports: ["127.0.0.1:8000:8000"]
    environment:
      JS_DATABASE_URL: postgresql+psycopg://journeysignal_reader:disposable_reader_only@postgres:5432/journeysignal
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  worker:
    profiles: [app]
    image: journeysignal:local
    pull_policy: never
    command: ["journeysignal-worker"]
    ports: ["127.0.0.1:9101:9101"]
    environment:
      JS_DATABASE_URL: postgresql+psycopg://journeysignal_demo:disposable_demo_only@postgres:5432/journeysignal
      JS_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JS_METRICS_BIND_HOST: 0.0.0.0
    depends_on:
      migrate: {condition: service_completed_successfully}
      topic-init: {condition: service_completed_successfully}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; s=urllib.request.urlopen('http://127.0.0.1:9101/', timeout=3).read(); exit(0 if b'journeysignal_worker_ready 1.0' in s else 1)"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  postgres_data:
  kafka_data:
